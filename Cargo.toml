# The repo root is BOTH the workspace root and the `polygit` binary package — so polygit's `src/`
# stays put while the reusable widget crate lives in `tui-pick/`. Profiles live here (workspace root)
# and apply to every member.
[workspace]
members = ["tui-pick"]
resolver = "2"

[package]
name = "polygit"
version = "3.24.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "polygit"
path = "src/main.rs"

[dependencies]
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.4"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
num_cpus = "1"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
strip-ansi-escapes = "0.2"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Already in the lock via syntect's fancy-regex, so a direct dep adds no build cost.
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
terminal-colorsaurus = "1.0.3"
tui-pick = { path = "tui-pick" }
# The scrollbar geometry lives here rather than in this repo, because the bug it prevents — a bar drawn
# over the last column of the text — is one every ratatui surface can have, and it was fixed here per
# call site four times before that stopped being a strategy. A git dependency rather than crates.io: the
# crate is unpublished, and the lockfile pins the revision either way.
tuilith = { git = "https://github.com/aylith-labs/tuilith", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Fast iteration profile: drops whole-program LTO and single-unit codegen (the bulk of the
# release build's ~40s link cost) while keeping opt-level 3. Only `make build` / CI ship the
# fully-optimized `release` profile; this one backs the `make dev` inner loop.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
