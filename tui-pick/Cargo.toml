[package]
name = "tui-pick"
version = "0.1.0"
edition = "2024"
description = "Reusable ratatui widgets: a floating-element positioning engine and presentational primitives (buttons, list rows, radios). The finder and folder picker moved to tuilith's `find`."
license = "MIT"

[lib]
name = "tui_pick"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
